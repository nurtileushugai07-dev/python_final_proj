<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Quiz Platform{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3a;
      --accent:    #6c63ff;
      --accent2:   #ff6584;
      --green:     #43d9a2;
      --red:       #ff6b6b;
      --yellow:    #ffd166;
      --text:      #e8eaf0;
      --muted:     #8b8fa8;
      --radius:    12px;
      --shadow:    0 4px 24px rgba(0,0,0,.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { opacity: .8; }

    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: .9rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .nav-brand span { color: var(--accent); }

    .nav-links { display: flex; gap: 1.5rem; }
    .nav-links a {
      color: var(--muted);
      font-weight: 500;
      font-size: .95rem;
      transition: color .2s;
    }
    .nav-links a:hover,
    .nav-links a.active { color: var(--text); }

    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      box-shadow: var(--shadow);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .65rem 1.4rem;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      border: none;
    }
    .btn:hover { opacity: .88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-primary  { background: var(--accent);  color: #fff; }
    .btn-outline  { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-success  { background: var(--green);   color: #0f1117; }

    .badge {
      display: inline-block;
      padding: .2rem .65rem;
      border-radius: 999px;
      font-size: .78rem;
      font-weight: 600;
    }
    .badge-mc   { background: rgba(108,99,255,.2); color: var(--accent); }
    .badge-tf   { background: rgba(67,217,162,.2); color: var(--green); }
    .badge-pass { background: rgba(67,217,162,.2); color: var(--green); }
    .badge-fail { background: rgba(255,107,107,.2); color: var(--red); }

    h1, h2, h3 { font-family: 'DM Serif Display', serif; }

    footer {
      text-align: center;
      padding: 1.2rem;
      color: var(--muted);
      font-size: .82rem;
      border-top: 1px solid var(--border);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    .fade-up { animation: fadeUp .4s ease both; }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}" class="nav-brand">
      🧠 <span>Quiz</span>Platform
    </a>
    <div class="nav-links">
      <a href="{{ url_for('index') }}"     {% if request.endpoint == 'index'     %}class="active"{% endif %}>Home</a>
      <a href="{{ url_for('dashboard') }}" {% if request.endpoint == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    Quiz &amp; Test Prep Platform — Final Project &copy; 2024
  </footer>

</body>
</html>
